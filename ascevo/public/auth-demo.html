<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Auth Demo - Growthovo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0B0618 0%, #1a0b2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 48px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      color: white;
    }
    
    .subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 32px;
      text-align: center;
      line-height: 1.5;
    }
    
    .input-group {
      margin-bottom: 20px;
      position: relative;
    }
    
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.7);
      transition: color 0.25s ease;
    }
    
    .input-wrapper {
      position: relative;
    }
    
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 16px 16px 16px 48px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      transition: all 0.25s ease;
      outline: none;
    }
    
    input:focus {
      border-color: #7C3AED;
      background: rgba(124, 58, 237, 0.1);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.2);
      animation: pulse 0.6s ease-out;
    }
    
    input:focus + .icon {
      opacity: 1;
      color: #7C3AED;
    }
    
    input:focus ~ label {
      color: #7C3AED;
    }
    
    input.success {
      border-color: #10B981;
      background: rgba(16, 185, 129, 0.1);
    }
    
    input.error {
      border-color: #EF4444;
      background: rgba(239, 68, 68, 0.1);
      animation: shake 0.5s ease;
    }
    
    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.4);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(124, 58, 237, 0);
      }
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
    
    .icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      opacity: 0.5;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    
    .success-check {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      font-size: 18px;
      color: #10B981;
      transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
    }
    
    .success-check.show {
      transform: translateY(-50%) scale(1);
    }
    
    .error-message {
      font-size: 13px;
      color: #FCA5A5;
      margin-top: 6px;
      opacity: 0;
      transform: translateY(-5px);
      transition: all 0.3s ease;
    }
    
    .error-message.show {
      opacity: 1;
      transform: translateY(0);
    }
    
    button {
      width: 100%;
      background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%);
      color: white;
      font-size: 18px;
      font-weight: 600;
      padding: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      margin-top: 8px;
      position: relative;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
    }
    
    button:active {
      transform: scale(0.97) translateY(0);
    }
    
    button.google {
      background: white;
      color: #1F2937;
      margin-top: 24px;
    }
    
    button.google:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }
    
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .divider span {
      padding: 0 16px;
    }
    
    .link-text {
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 24px;
    }
    
    .link-text a {
      color: #A78BFA;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }
    
    .link-text a:hover {
      color: #7C3AED;
    }
    
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    
    .checkbox-wrapper input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    
    .checkbox-wrapper label {
      margin: 0;
      font-size: 14px;
      cursor: pointer;
    }
    
    .info-banner {
      background: rgba(124, 58, 237, 0.15);
      border: 2px solid rgba(124, 58, 237, 0.3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: center;
    }
    
    .info-banner strong {
      color: #A78BFA;
      display: block;
      margin-bottom: 8px;
    }
    
    .info-banner p {
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="info-banner">
      <strong>✨ Enhanced Auth Demo</strong>
      <p>This is a standalone demo of the enhanced authentication screens with all premium animations and interactions.</p>
    </div>
    
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue to Growthovo.</p>
    
    <form id="loginForm" onsubmit="handleSubmit(event)">
      <div class="input-group">
        <label for="email">✉ Email address</label>
        <div class="input-wrapper">
          <span class="icon">✉</span>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your email"
            onblur="validateEmail(this)"
            oninput="clearError(this)"
          />
          <span class="success-check">✓</span>
        </div>
        <p class="error-message"></p>
      </div>
      
      <div class="input-group">
        <label for="password">🔒 Password</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter your password"
            onblur="validatePassword(this)"
            oninput="clearError(this)"
          />
          <span class="success-check">✓</span>
        </div>
        <p class="error-message"></p>
      </div>
      
      <div class="checkbox-wrapper">
        <input type="checkbox" id="remember" checked />
        <label for="remember">Remember me</label>
      </div>
      
      <button type="submit">Sign In →</button>
    </form>
    
    <div class="divider"><span>or</span></div>
    
    <button class="google" onclick="alert('Google OAuth would be triggered here')">
      Sign in with Google
    </button>
    
    <p class="link-text">
      Don't have an account? <a href="#" onclick="alert('Navigate to signup screen'); return false;">Sign up</a>
    </p>
  </div>

  <script>
    function validateEmail(input) {
      const value = input.value.trim();
      const errorMsg = input.parentElement.nextElementSibling;
      const check = input.parentElement.querySelector('.success-check');
      
      if (!value) {
        showError(input, errorMsg, 'Email is required.');
        check.classList.remove('show');
        return false;
      }
      
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(value)) {
        showError(input, errorMsg, 'Please enter a valid email address.');
        check.classList.remove('show');
        return false;
      }
      
      showSuccess(input, errorMsg, check);
      return true;
    }
    
    function validatePassword(input) {
      const value = input.value;
      const errorMsg = input.parentElement.nextElementSibling;
      const check = input.parentElement.querySelector('.success-check');
      
      if (!value) {
        showError(input, errorMsg, 'Password is required.');
        check.classList.remove('show');
        return false;
      }
      
      if (value.length < 6) {
        showError(input, errorMsg, 'Password must be at least 6 characters.');
        check.classList.remove('show');
        return false;
      }
      
      showSuccess(input, errorMsg, check);
      return true;
    }
    
    function showError(input, errorMsg, message) {
      input.classList.remove('success');
      input.classList.add('error');
      errorMsg.textContent = message;
      errorMsg.classList.add('show');
      
      // Trigger shake animation
      setTimeout(() => {
        input.classList.remove('error');
      }, 500);
    }
    
    function showSuccess(input, errorMsg, check) {
      input.classList.remove('error');
      input.classList.add('success');
      errorMsg.classList.remove('show');
      check.classList.add('show');
    }
    
    function clearError(input) {
      input.classList.remove('error', 'success');
      const errorMsg = input.parentElement.nextElementSibling;
      const check = input.parentElement.querySelector('.success-check');
      errorMsg.classList.remove('show');
      check.classList.remove('show');
    }
    
    function handleSubmit(event) {
      event.preventDefault();
      
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      
      const emailValid = validateEmail(emailInput);
      const passwordValid = validatePassword(passwordInput);
      
      if (emailValid && passwordValid) {
        alert('✅ Form validated successfully!\\n\\nIn the real app, this would:\\n1. Call Supabase auth.signIn()\\n2. Handle loading states\\n3. Show friendly error messages\\n4. Redirect to the main app\\n\\nThis demo shows all the premium animations and validation!');
      }
    }
  </script>
</body>
</html>
