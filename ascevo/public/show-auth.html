<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Auth...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0B0618 0%, #1a0b2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #A78BFA;
    }
    p {
      font-size: 18px;
      margin-bottom: 10px;
      color: rgba(255, 255, 255, 0.8);
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(124, 58, 237, 0.3);
      border-top-color: #7C3AED;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 30px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 Redirecting to Auth Screens...</h1>
    <div class="spinner"></div>
    <p>Clearing all storage and showing login screen</p>
    <p id="status">Please wait...</p>
  </div>

  <script>
    (async function() {
      const status = document.getElementById('status');
      
      try {
        status.textContent = 'Clearing localStorage...';
        localStorage.clear();
        await new Promise(resolve => setTimeout(resolve, 300));
        
        status.textContent = 'Clearing sessionStorage...';
        sessionStorage.clear();
        await new Promise(resolve => setTimeout(resolve, 300));
        
        status.textContent = 'Clearing cookies...';
        document.cookie.split(";").forEach(c => {
          document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
        });
        await new Promise(resolve => setTimeout(resolve, 300));
        
        status.textContent = 'Clearing IndexedDB...';
        if (window.indexedDB && window.indexedDB.databases) {
          const dbs = await window.indexedDB.databases();
          for (const db of dbs) {
            if (db.name) {
              window.indexedDB.deleteDatabase(db.name);
            }
          }
        }
        await new Promise(resolve => setTimeout(resolve, 500));
        
        status.textContent = 'Redirecting to login...';
        await new Promise(resolve => setTimeout(resolve, 500));
        
        // Redirect with the force parameter
        window.location.href = '/?showAuth=true';
      } catch (error) {
        status.textContent = 'Error: ' + error.message;
        console.error(error);
        setTimeout(() => {
          window.location.href = '/?showAuth=true';
        }, 2000);
      }
    })();
  </script>
</body>
</html>
